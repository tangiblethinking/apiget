<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Google AI Studio</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem;
      background: #f5f5f5;
    }
    button {
      padding: 0.8rem 1.6rem;
      font-size: 1.1rem;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #1a73e8;
      color: white;
      width: 100%;
      max-width: 320px;
    }
    button:hover {
      background: #1557b0;
    }
  </style>
</head>
<body>
  <h1>Google AI Studio API Keys</h1>
  
  <button onclick="openLink()">Open API Keys</button>

  <script>
    function openLink() {
      const url = 'https://aistudio.google.com/api-keys';

      // On mobile this usually opens a new tab.
      // On desktop it can open a popup if allowed.
      const popup = window.open(url, '_blank');

      if (!popup || popup.closed || typeof popup.closed === 'undefined') {
        // Fallback if blocked
        window.location.href = url;
      }
    }
  </script>
</body>
</html>
